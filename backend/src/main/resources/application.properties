# ===================================================================
# Sunday Challenge - Application Configuration (Stage 2)
# ===================================================================

# -------------------------------------------------------------------
# Server Configuration
# -------------------------------------------------------------------
server.port=8080
spring.application.name=sunday-challenge-backend

# Frontend Base URL (Used for post-login OAuth redirects)
app.frontend.url=${FRONTEND_URL:http://localhost:5500/frontend}

# -------------------------------------------------------------------
# Database Configuration (MySQL - Sunday_challenge)
# Environment variable placeholders with local defaults
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:Sunday_challenge}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:password}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# Connection Pool (HikariCP)
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=3000

# -------------------------------------------------------------------
# JPA & Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Spring Security OAuth2 Client (Google)
# -------------------------------------------------------------------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your_google_client_id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# -------------------------------------------------------------------
# Session & Cookie Management
# -------------------------------------------------------------------
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=Lax
server.servlet.session.timeout=30m

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.sundaychallenge=DEBUG
logging.level.org.springframework.security=INFO
