# ===================================================================
# Sunday Challenge - Test Application Configuration
# ===================================================================

server.port=8080
spring.application.name=sunday-challenge-backend-test

app.frontend.url=http://localhost:5500

# H2 In-Memory Database for Unit & Integration Testing
spring.datasource.url=jdbc:h2:mem:Sunday_challenge;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Dummy Google OAuth Client settings for testing
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
