<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sunday Challenge - Login with Google OAuth2">
  <title>Login — Sunday Challenge</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Navigation Header -->
  <header>
    <nav class="navbar" aria-label="Main Navigation">
      <a href="../index.html" class="brand">
        <div class="brand-icon">SC</div>
        <div class="brand-title">Sunday <span>Challenge</span></div>
      </a>
      <ul class="nav-links">
        <li><a href="../index.html" class="nav-link">Home</a></li>
        <li><a href="login.html" class="nav-link active">Login</a></li>
        <li><a href="student-dashboard.html" class="nav-link">Student</a></li>
        <li><a href="admin-dashboard.html" class="nav-link">Admin / T&amp;P</a></li>
        <li><a href="exam.html" class="nav-link">Exams</a></li>
        <li><a href="result.html" class="nav-link">Results</a></li>
      </ul>
      <span class="stage-badge">Stage 2 Active</span>
    </nav>
  </header>

  <!-- Login Container -->
  <main class="container" style="max-width: 520px; margin-top: 4rem;">
    <div class="card" style="text-align: center; padding: 3rem 2.5rem;">
      
      <div class="brand-icon" style="width: 56px; height: 56px; font-size: 1.8rem; margin: 0 auto 1.5rem auto; border-radius: 16px;">SC</div>

      <h1 style="font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.02em;">
        Sunday Challenge
      </h1>
      
      <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
        Online Assessment Platform
      </p>

      <!-- OAuth Error Message Banner -->
      <div id="auth-error-banner" style="display: none; background: rgba(244, 63, 94, 0.12); border: 1px solid rgba(244, 63, 94, 0.3); color: #fda4af; padding: 0.85rem; border-radius: var(--radius-md); font-size: 0.875rem; margin-bottom: 1.5rem;">
        ⚠️ Authentication failed. Please try again.
      </div>

      <!-- Google OAuth Login Button -->
      <a href="http://localhost:8080/oauth2/authorization/google" class="btn" id="google-login-btn" style="width: 100%; justify-content: center; padding: 0.9rem 1.5rem; font-size: 1rem; background: #ffffff; color: #1f2937; box-shadow: 0 4px 14px rgba(0,0,0,0.25);">
        <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
        </svg>
        Continue with Google
      </a>

      <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); color: var(--text-dim); font-size: 0.8rem;">
        Secure authentication powered by Google OAuth 2.0 &amp; Spring Security.
      </div>
    </div>
  </main>

  <script>
    // Check for error parameters in URL
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('error')) {
      const banner = document.getElementById('auth-error-banner');
      if (banner) banner.style.display = 'block';
    }
  </script>
</body>
</html>
